services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cadence-db
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports:
      - "5434:5432"
    volumes:
      - cadence_pg:/var/lib/postgresql/data
      - ./supabase/migrations/0001_local.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: cadence-api
    environment:
      DATABASE_URL: postgresql://cadence:cadence@db:5432/cadence
      ALLOW_DEV_AUTH: "true"
      DEV_USER_ID: "00000000-0000-4000-8000-000000000001"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JOB_SECRET: local-job-secret-change-me
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  cadence_pg:
