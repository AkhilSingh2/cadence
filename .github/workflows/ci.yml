name: CI and demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trainer
          POSTGRES_PASSWORD: trainer
          POSTGRES_DB: trainer
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U trainer -d trainer"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://trainer:trainer@localhost:5434/trainer
      ALLOW_DEV_AUTH: "true"
      JOB_SECRET: ci-job-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Unit tests
        working-directory: backend
        run: python -m pytest -q
      - name: Apply schema
        run: PGPASSWORD=trainer psql -h localhost -p 5434 -U trainer -d trainer -v ON_ERROR_STOP=1 -q -f supabase/migrations/0001_local.sql
      - name: End-to-end smoke test
        run: |
          cd backend
          uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/v1/healthz && break; sleep 1; done
          cd .. && ./scripts/smoke_test.sh http://127.0.0.1:8000/v1
      - name: Build demo
        run: python3 scripts/build_demo.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
