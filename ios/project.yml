name: Cadence
options:
  bundleIdPrefix: com.cadence
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set in Xcode
targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: Cadence/Cadence
    resources: []
    info:
      path: Cadence/Cadence/Info.plist
      properties:
        CFBundleDisplayName: Cadence
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Cadence reads sleep, heart rate, energy, and workouts to adapt your daily plan.
        NSHealthUpdateUsageDescription: Cadence may save workouts you log.
        NSSpeechRecognitionUsageDescription: Cadence transcribes your voice on-device for check-ins.
        NSMicrophoneUsageDescription: Cadence listens during voice check-ins.
        UIBackgroundModes: [fetch, processing]
    entitlements:
      path: Cadence/Cadence/Cadence.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cadence.app
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
